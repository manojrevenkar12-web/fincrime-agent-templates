[project]
name = "fat"
version = "1.0.0"
description = "One screening-review agent (sanctions, PEP, adverse media) configured and activated per customer, with a REST API and a release gate"
requires-python = ">=3.12"
dependencies = ["rapidfuzz>=3.0", "fastapi>=0.110", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "E731", "SIM102", "SIM108", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/fat/world/*" = ["E501", "RUF007", "RUF015"]

[tool.ruff.format]
exclude = ["src/fat/world/*", "scripts/build_world.py"]
